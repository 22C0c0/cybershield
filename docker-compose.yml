services:
  # ============================================
  # CyberShield — High-Performance Cybersecurity Suite
  # ============================================

  # --- Infrastructure ---

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Module 1: NIDS (Network Intrusion Detection) ---
  nids:
    build:
      context: .
      dockerfile: modules/nids/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - LOG_LEVEL=INFO
      - NIDS_INTERFACE=eth0
    volumes:
      - /var/log:/var/log:ro
    cap_add:
      - NET_RAW
    network_mode: host
    restart: unless-stopped

  # --- Module 2: Malware Sandbox ---
  malware-sandbox:
    build:
      context: .
      dockerfile: modules/malware_sandbox/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - sandbox_uploads:/tmp/cybershield_sandbox
    restart: unless-stopped

  # --- Module 3: Vulnerability Scanner ---
  vuln-scanner:
    build:
      context: .
      dockerfile: modules/vuln_scanner/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - LOG_LEVEL=INFO
    network_mode: host
    restart: unless-stopped

  # --- Module 4: SIEM ---
  siem:
    build:
      context: .
      dockerfile: modules/siem/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - /var/log:/var/log:ro
      - siem_rules:/app/rules
    restart: unless-stopped

  # --- Module 5: Zero Trust Auth Proxy ---
  zero-trust-proxy:
    build:
      context: .
      dockerfile: modules/zero_trust_proxy/Dockerfile
    ports:
      - "8005:8005"
    environment:
      - LOG_LEVEL=INFO
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    restart: unless-stopped

  # --- Module 6: Secrets Detector ---
  secrets-detector:
    build:
      context: .
      dockerfile: modules/secrets_detector/Dockerfile
    ports:
      - "8006:8006"
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - /home:/scan-targets:ro
    restart: unless-stopped

volumes:
  redis_data:
  sandbox_uploads:
  siem_rules:
